name: NodeLoc 每日签到

on:
  schedule:
    # UTC 03:09 = 北京时间 11:09
    - cron: "9 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nodeloc-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      NL_COOKIE: ${{ secrets.NL_COOKIE }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Shanghai

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 执行签到
        run: python main.py
